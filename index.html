<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>امتحاني</title>
  <meta name="theme-color" content="#0f172a" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['Cairo', 'system-ui', 'sans-serif'], }, colors: { brand: { 50: '#f0fdfa', 100: '#ccfbf1', 200: '#99f6e4', 300: '#5eead4', 400: '#2dd4bf', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e', 800: '#115e59', 900: '#134e4a', 950: '#042f2e' } } } }
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <style>
    body { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
    .scroll-thin::-webkit-scrollbar { width: 6px; height: 6px; } .scroll-thin::-webkit-scrollbar-track { background: transparent; } .scroll-thin::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 10px; }
    .dark .scroll-thin::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.5); }
    @keyframes slideUpFade { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } } .animate-enter { animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @media print {
      body { background: white !important; color: black !important; }
      .no-print, nav, button { display: none !important; }
      .print-only { display: block !important; }
      .question-card { break-inside: avoid; border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; border-radius: 8px; }
      canvas { max-width: 100% !important; height: auto !important; }
      #exam-header { text-align: center; margin-bottom: 30px; padding-bottom: 10px; border-bottom: 2px solid #000; }
    }
    @media screen { .print-only { display: none; } }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 selection:bg-brand-500 selection:text-white antialiased w-full box-border">
  <div id="root" class="w-full box-border"></div>

<script>
const CONFIG = { APP_NAME: 'امتحاني', APP_SUBTITLE: 'منصة التدريب والتقييم الذكية، تدرب وحلل أدائك باحترافية', API_BASE: 'https://script.google.com/macros/s/AKfycbxbRTV0pYSXJDRQe2oTBzhVaNYkW9P-ILbB2FruLQp1Tgf7eJOM7OByJa6ioH7NK9Zalw/exec', ADMIN_PASSWORD: 'admin', STORAGE_KEYS: { user: 'dirasti_user_v10', darkMode: 'dirasti_dark_v10', savedExam: 'dirasti_saved_exam_v10' } };

const CURRICULUM = {
  gradeAr: 'الثانوية العامة', trackAr: 'الفرع العلمي', comprehensiveLabel: 'بنك شامل للمادة',
  subjects: [
    { code: 'chemistry', nameAr: 'الكيمياء', examMode: 'OMR_MCQ', semesters: [ { semester: 1, titleAr: 'الفصل الأول', units: ['حالات المادة','المحاليل','الاتزان الكيميائي','الحموض والقواعد وتطبيقاتها'] }, { semester: 2, titleAr: 'الفصل الثاني', units: ['الكيمياء الحركيه','الكيمياء الكهربائيه','الكيمياء العضويه'] } ] },
    { code: 'life_sciences', nameAr: 'الأحياء', examMode: 'OMR_MCQ', semesters: [ { semester: 1, titleAr: 'الفصل الأول', units: ['كيمياء الحياة','دوره الخليه وتصنيع البروتينات','الوراثة','التكنولوجيا الحيوية'] }, { semester: 2, titleAr: 'الفصل الثاني', units: ['التنظيم والاتزان','الدعامه والحركه','الهضم والنقل وتبادل الغازات','الاخراج والتكاثر','المناعه والمضادات الحيويه'] } ] },
    { code: 'islamic_education', nameAr: 'التربية الإسلامية', examMode: 'OMR_MCQ', semesters: [ { semester: 1, titleAr: 'الفصل الأول', units: ['علاقه الانسان بربه','علاقه الانسان بنفسه','علاقه الانسان بمن حوله'] }, { semester: 2, titleAr: 'الفصل الثاني', units: ['علاقه الانسان بربه','علاقه الانسان بنفسه','علاقه الانسان بمن حوله'] } ] },
    { code: 'english', nameAr: 'Advance English', examMode: 'OMR_MCQ', semesters: [ { semester: 1, titleAr: 'Semester 1', units: ['Unit 1','Unit 2','Unit 3','Unit 4','Unit 5'] }, { semester: 2, titleAr: 'Semester 2', units: ['Unit 6','Unit 7','Unit 8','Unit 9','Unit 10'] } ] }
  ]
};

const THEMES = [ { border: 'border-brand-500', textMain: 'text-brand-600 dark:text-brand-400' }, { border: 'border-blue-500', textMain: 'text-blue-600 dark:text-blue-400' }, { border: 'border-purple-500', textMain: 'text-purple-600 dark:text-purple-400' } ];

const state = {
  user: loadLocal(CONFIG.STORAGE_KEYS.user, null), darkMode: loadLocal(CONFIG.STORAGE_KEYS.darkMode, false),
  loading: false, toast: null,
  data: { exams: [], results: [], analytics: { overallMastery: 0, subjectMastery: [], unitMastery: [], weaknessRows: [] }, questionBankSummary: { totalQuestions: 0, bySubject: {}, byUnitKey: {}, subjects: [] }, leaderboard: [] },
  subjectCode: null, subjectTab: 'units', unitKey: null,
  prestartExam: null, examSession: null, reviewAttempt: null, timerId: null,
  admin: { open: false, authenticated: false, tab: 'upload', allResults: [], selectedUserId: null, selectedSubjectCode: null, form: { subjectCode: '', unitKey: '', editingExamId: null, pdfDataUrl: null, pdfFileName: '' } },
  builder: { totalQuestions: 50, mode: 'weighted', selectedUnitKeys: [], explicitCounts: {}, selectedExamIds: [] },
  editQuestionData: null
};

window.__PDF_SOURCES = {}; window.__PDF_DOCS = {};

function loadLocal(k, f) { try { return JSON.parse(localStorage.getItem(k)) || f; } catch { return f; } }
function saveLocal(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
function setDarkMode(v) { state.darkMode = !!v; document.documentElement.classList.toggle('dark', state.darkMode); saveLocal(CONFIG.STORAGE_KEYS.darkMode, state.darkMode); }
setDarkMode(state.darkMode);

function escapeHtml(v) { return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function initials(n) { return String(n||'').split(/\s+/).filter(Boolean).slice(0,2).map(p=>p[0]).join('').toUpperCase() || 'ط'; }
function formatDate(v) { if(!v) return '-'; try { return new Date(v).toLocaleString('ar-JO', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch { return String(v); } }
function formatTime(s) { const min = String(Math.floor(s/60)).padStart(2,'0'), sec = String(s%60).padStart(2,'0'); return `${min}:${sec}`; }
function percent(c, t) { return t ? Math.round((Number(c||0)/Number(t))*100) : 0; }
function parseUnitKey(uk) { const p = String(uk||'').split('||'); return { subjectCode: p[0]||'', semester: Number(p[1]||0), unitTitleAr: p.slice(2).join('||')||'' }; }

async function api(act, p) {
  const res = await fetch(CONFIG.API_BASE, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action: act }, p || {})) });
  const data = await res.json(); if (!data.ok) throw new Error(data.error); return data;
}

function showToast(msg, type='success') { state.toast = { msg, type }; render(); setTimeout(() => { state.toast = null; render(); }, 3500); }
function setLoading(v) { state.loading = !!v; render(); }

function getGamificationStats() {
  const results = state.data.results || [];
  if(!results.length) return { streak: 0, badges: [] };
  let perfects = results.filter(r => r.score === 100).length;
  let badges = perfects >= 5 ? ['🏆 ملك التفوق'] : [];
  if(results.length >= 10) badges.push('📚 باحث نشيط');
  let dates = [...new Set(results.map(r => new Date(r.createdAt).toDateString()))].sort((a,b) => new Date(b) - new Date(a));
  let streak = 0, today = new Date().toDateString(), yesterday = new Date(Date.now() - 86400000).toDateString();
  if(dates.includes(today) || dates.includes(yesterday)) {
      let checkDate = dates.includes(today) ? new Date() : new Date(Date.now() - 86400000);
      for(let i=0; i<dates.length; i++) {
         if(dates[i] === checkDate.toDateString()) { streak++; checkDate.setDate(checkDate.getDate() - 1); } else break;
      }
  }
  return { streak, badges };
}

async function refreshData() {
  if (!state.user) return;
  try {
    setLoading(true);
    const [cat, res, anl, lead] = await Promise.all([ api('getCatalog'), api('getUserResults', { userId: state.user.id }), api('getUserAnalytics', { userId: state.user.id }), api('getLeaderboard') ]);
    state.data.exams = cat.exams || []; state.data.questionBankSummary = cat.questionBank || { subjects: [] };
    state.data.results = res.results || []; state.data.analytics = anl.analytics || { unitMastery: [], weaknessRows: [] };
    state.data.leaderboard = lead.leaderboard || [];
    checkSavedSession();
    render();
  } catch (err) { showToast(err.message, 'error'); } finally { setLoading(false); render(); }
}

function checkSavedSession() {
  if(!state.examSession && !state.prestartExam && !state.reviewAttempt) {
    const saved = loadLocal(CONFIG.STORAGE_KEYS.savedExam, null);
    if(saved && saved.userId === state.user.id) {
       if(confirm('يوجد امتحان غير مكتمل، هل تريد استئنافه الآن؟')) {
          state.examSession = saved.session; render(); startExamTimer();
       } else { localStorage.removeItem(CONFIG.STORAGE_KEYS.savedExam); }
    }
  }
}

function buildSubjectUnits(sc) {
  const sub = CURRICULUM.subjects.find(s=>s.code===sc); if(!sub) return []; const units = [];
  sub.semesters.forEach(sem => { sem.units.forEach(ut => { units.push({ key: makeUnitKey(sc, sem.semester, ut), subjectCode: sc, semester: sem.semester, semesterTitleAr: sem.titleAr, unitTitleAr: ut, weight: Number(sub.weights[`${sem.semester}|${ut}`]||0) }); }); });
  units.push({ key: makeUnitKey(sc, 0, CURRICULUM.comprehensiveLabel), subjectCode: sc, semester: 0, semesterTitleAr: 'الفصلان معاً', unitTitleAr: CURRICULUM.comprehensiveLabel, weight: 0, comprehensive: true });
  return units;
}

function getExamsForUnit(sc, uk) { const inf = parseUnitKey(uk); return (state.data.exams||[]).filter(e => e.subjectCode === sc && Number(e.semester||0) === Number(inf.semester||0) && String(e.unitTitleAr||'').trim() === String(inf.unitTitleAr||'').trim()); }
function getQuestionCountForUnit(uk) { return Number((state.data.questionBankSummary.byUnitKey||{})[uk]||0); }
function getExamsForSubject(sc) { return (state.data.exams || []).filter(e => e.subjectCode === sc); }
function getAttemptsForSubject(sc) { return (state.data.results || []).filter(r => r.subjectCode === sc); }
function getUnitAnalytics(sc) { return (state.data.analytics.unitMastery || []).filter(i => i.subjectCode === sc); }
function getSubjectAnalytics(sc) { return (state.data.analytics.subjectMastery || []).find(i => i.subjectCode === sc) || null; }

function resetBuilderForSubject(sc) {
  const units = buildSubjectUnits(sc).filter(u => !u.comprehensive);
  state.builder.selectedUnitKeys = units.slice(0, Math.min(4, units.length)).map(u => u.key);
  state.builder.selectedExamIds = []; 
  state.builder.selectedUnitKeys.forEach(uk => { getExamsForUnit(sc, uk).forEach(e => { if(!state.builder.selectedExamIds.includes(e.id)) state.builder.selectedExamIds.push(e.id); }); });
  state.builder.explicitCounts = {}; state.builder.mode = 'weighted'; state.builder.totalQuestions = 100;
}

function openSubject(sc) { state.subjectCode = sc; state.subjectTab = 'units'; state.unitKey = null; resetBuilderForSubject(sc); render(); }
function backToHome() { state.subjectCode = null; state.subjectTab = 'units'; state.unitKey = null; state.reviewAttempt = null; state.examSession = null; clearExamTimer(); render(); }
function openAdmin() { state.admin.open = true; render(); }
function closeAdmin() { state.admin.open = false; render(); }

async function adminLogin(pw) {
  if (pw !== CONFIG.ADMIN_PASSWORD) return showToast('كلمة المرور غير صحيحة', 'error');
  state.admin.authenticated = true;
  try { setLoading(true); const res = await api('listAllResults', { adminPassword: pw }); state.admin.allResults = res.results || []; if (!state.admin.form.subjectCode && CURRICULUM.subjects.length > 0) state.admin.form.subjectCode = CURRICULUM.subjects[0].code; } catch (err) { showToast(err.message, 'error'); } finally { setLoading(false); render(); }
}

function renderLogin() {
  return `
    <div class="min-h-screen flex items-center justify-center p-4 bg-slate-50 dark:bg-slate-950 w-full box-border">
      <div class="w-full max-w-4xl grid md:grid-cols-2 bg-white dark:bg-slate-900 rounded-[2rem] overflow-hidden shadow-soft border border-slate-100 dark:border-slate-800">
        <div class="p-8 md:p-12 flex flex-col justify-center bg-gradient-to-br from-brand-600 to-brand-800 text-white relative">
          <h1 class="text-4xl font-black mb-4 tracking-tight">${escapeHtml(CONFIG.APP_NAME)}</h1>
          <p class="text-brand-100 text-base leading-relaxed">${escapeHtml(CONFIG.APP_SUBTITLE)}</p>
        </div>
        <div class="p-8 md:p-12 flex flex-col justify-center">
          <div class="text-sm font-bold text-brand-600 dark:text-brand-400 mb-2">دخول المنصة</div>
          <h2 class="text-2xl font-black text-slate-900 dark:text-white mb-6">ابدأ رحلتك الآن</h2>
          <div>
             <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">الاسم الكامل</label>
             <input id="login-name" class="w-full px-5 py-4 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-2xl outline-none font-semibold mb-4" placeholder="أدخل اسمك..." />
             <button data-action="login" class="w-full py-4 bg-slate-900 hover:bg-slate-800 dark:bg-brand-600 text-white rounded-2xl font-bold shadow-md">دخول للمنصة</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

function renderHeaderControls() {
  const stats = getGamificationStats();
  return `
    <div class="bg-white dark:bg-slate-900 rounded-[2rem] p-4 sm:p-6 mb-6 flex flex-col md:flex-row justify-between items-center gap-4 shadow-soft border border-slate-100 dark:border-slate-800 animate-enter w-full box-border">
      <div class="flex items-center gap-3 w-full md:w-auto">
        <div class="w-12 h-12 rounded-xl bg-brand-50 text-brand-600 flex items-center justify-center text-lg font-black shrink-0">${escapeHtml(initials(state.user.name))}</div>
        <div class="min-w-0 flex-1">
          <h2 class="text-base sm:text-lg font-black text-slate-900 dark:text-white truncate">${escapeHtml(state.user.name)}</h2>
          <div class="text-[10px] sm:text-xs font-bold text-slate-500 flex gap-2 items-center">
             <span class="text-orange-500">🔥 ${stats.streak} يوم</span>
             ${stats.badges.length ? `<span class="text-amber-500">${stats.badges[0]}</span>` : ''}
          </div>
        </div>
      </div>
      <div class="flex items-center gap-1.5 sm:gap-2 bg-slate-50 dark:bg-slate-950 p-1.5 sm:p-2 rounded-2xl border border-slate-100 dark:border-slate-800 w-full md:w-auto justify-center overflow-x-auto scroll-thin">
        <button data-action="open-leaderboard" class="px-3 sm:px-4 py-2 rounded-xl bg-white dark:bg-slate-900 font-bold text-[10px] sm:text-xs text-amber-600 hover:bg-amber-50 whitespace-nowrap">🏆 الأوائل</button>
        <button data-action="toggle-dark" class="px-3 py-2 rounded-xl bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300">💡</button>
        <button data-action="open-admin" class="px-3 sm:px-4 py-2 rounded-xl bg-white dark:bg-slate-900 font-bold text-[10px] sm:text-xs text-slate-700 dark:text-slate-200">الإدارة</button>
        <button data-action="logout" class="px-3 sm:px-4 py-2 rounded-xl bg-rose-50 dark:bg-rose-900/20 font-bold text-[10px] sm:text-xs text-rose-600 hover:bg-rose-100">خروج</button>
      </div>
    </div>
  `;
}

function renderBackButton() { return `<button data-action="go-home" class="mb-4 text-xs font-bold text-slate-500 hover:text-slate-900 dark:hover:text-white bg-white dark:bg-slate-900 px-4 py-2 rounded-xl shadow-sm border border-slate-100 dark:border-slate-800">← العودة للرئيسية</button>`; }

function buildSubjectCards() {
  return CURRICULUM.subjects.map((sub,i) => {
    const anl = getSubjectAnalytics(sub.code);
    return `<button data-action="open-subject" data-subject-code="${sub.code}" class="text-right flex flex-col bg-white dark:bg-slate-900 rounded-3xl p-5 border border-slate-100 dark:border-slate-800 shadow-sm hover:shadow-md transition-all group">
      <div class="w-10 h-10 rounded-xl bg-brand-50 dark:bg-brand-900/20 text-brand-600 dark:text-brand-400 flex items-center justify-center text-lg font-black mb-3 group-hover:scale-110 transition-transform">${sub.nameAr[0]}</div>
      <h3 class="text-base font-black text-slate-900 dark:text-white truncate">${sub.nameAr}</h3>
      <div class="mt-4 text-[10px] font-bold text-slate-500 bg-slate-50 dark:bg-slate-950 p-2 rounded-lg text-center">الإتقان: ${anl?anl.mastery:0}%</div>
    </button>`;
  }).join('');
}

function renderHome() {
  const recent = (state.data.results || []).slice(0, 4);
  return `
    <div class="animate-enter w-full box-border">
      ${renderHeaderControls()}
      <div class="mb-6 grid grid-cols-1 sm:grid-cols-2 gap-4">
        <button data-action="daily-review" class="p-5 rounded-[2rem] bg-gradient-to-r from-brand-600 to-brand-500 text-white font-black text-right shadow-float transform hover:scale-[1.02] transition-transform">
           <div class="text-2xl mb-1">مراجعة اليوم 🧠</div><div class="text-xs text-brand-100 font-bold">تكرار متباعد للأخطاء السابقة لتثبيت الحفظ</div>
        </button>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">${buildSubjectCards()}</div>
      <div class="bg-white dark:bg-slate-900 rounded-[2rem] p-5 border border-slate-100 dark:border-slate-800 shadow-sm overflow-hidden box-border">
        <h3 class="text-sm font-black mb-4 border-r-4 border-brand-500 pr-2">آخر المحاولات</h3>
        <div class="space-y-2">
          ${recent.length ? recent.map(r => `
            <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-3 p-3 bg-slate-50 dark:bg-slate-950 rounded-xl border border-slate-100 dark:border-slate-800/60 w-full box-border">
              <div class="min-w-0 w-full sm:w-auto"><div class="font-black text-[11px] sm:text-xs truncate">${escapeHtml(r.examTitle)}</div><div class="text-[9px] text-slate-500 mt-1 truncate">${escapeHtml(r.unitTitleAr)} • ${formatDate(r.createdAt)}</div></div>
              <div class="flex items-center justify-between sm:justify-end gap-3 shrink-0 w-full sm:w-auto"><div class="font-black text-sm ${r.score>=50?'text-brand-600':'text-rose-500'}">${r.score}%</div><button data-action="review-attempt" data-attempt-id="${r.id||r.resultId}" class="px-3 py-1.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-md font-bold text-[10px]">مراجعة</button></div>
            </div>
          `).join('') : '<div class="text-center text-xs text-slate-400 font-bold py-4">لا توجد محاولات.</div>'}
        </div>
      </div>
    </div>
  `;
}

function renderLeaderboardModal() {
  return `
    <div class="fixed inset-0 z-[100] bg-slate-900/90 backdrop-blur-md flex items-center justify-center p-4 animate-enter w-full h-full box-border">
      <div class="bg-white dark:bg-slate-900 w-full max-w-md rounded-[2rem] p-6 shadow-2xl border border-slate-200 dark:border-slate-800 flex flex-col max-h-[90vh]">
        <div class="flex justify-between items-center mb-6"><h3 class="text-xl font-black text-amber-500">🏆 لوحة الشرف</h3><button data-action="close-leaderboard" class="w-8 h-8 bg-slate-100 dark:bg-slate-800 rounded-full font-bold text-xs">✕</button></div>
        <div class="overflow-y-auto scroll-thin flex-1 pr-2 space-y-3">
          ${state.data.leaderboard.length ? state.data.leaderboard.map((u, i) => `<div class="flex items-center justify-between p-3 bg-slate-50 dark:bg-slate-950 rounded-xl border border-slate-100 dark:border-slate-800"><div class="flex items-center gap-3"><div class="w-6 font-black text-slate-400 text-sm text-center">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</div><div class="font-bold text-sm">${escapeHtml(u.maskedName)}</div></div><div class="text-xs font-black text-brand-600 bg-brand-50 dark:bg-brand-900/30 px-2 py-1 rounded">${u.totalCorrect} صحيح</div></div>`).join('') : '<div class="text-center text-xs text-slate-500">لا يوجد.</div>'}
        </div>
      </div>
    </div>
  `;
}

function getQuestionPdfSource(q, exam) { return q.sourcePdfBase64 || (exam && exam.sourcePdfsMap && q.sourceExamId && exam.sourcePdfsMap[q.sourceExamId]) || (exam && exam.sourcePdf && exam.sourcePdf.base64) || ''; }
function renderPdfPreview(q, ex, sfx) {
  const pageNum = (q.pdfPageRef && q.pdfPageRef.page) || q.pageId || q.picId;
  if (!pageNum) return ''; const b64 = getQuestionPdfSource(q, ex); 
  if (!b64) return '<div class="p-2 bg-slate-100 dark:bg-slate-800 rounded-lg text-[9px] font-bold text-slate-500 text-center mt-3">ملف غير متاح</div>';
  const k = `${q.sourceExamId || 'ex'}_${q.id || 'q'}_${sfx || 'exam'}`; window.__PDF_SOURCES[k] = b64;

function renderQuestionCard(q, i, ex, mode) {
  const sess = state.examSession, rev = state.reviewAttempt, ans = mode === 'review' ? (rev ? rev.answers[q.id] : null) : (sess ? sess.answers[q.id] : null), timeSpent = mode === 'review' ? (rev && rev.timePerQuestion ? rev.timePerQuestion[q.id] || 0 : 0) : 0, ro = mode === 'review', hasPage = (q.pdfPageRef && q.pdfPageRef.page) || q.pageId || q.picId;
  return `
    <div class="question-card bg-white dark:bg-slate-900 p-4 sm:p-6 rounded-3xl shadow-sm border border-slate-100 dark:border-slate-800 mb-4 w-full box-border overflow-hidden">
      ${ro ? `<div class="flex justify-between items-center mb-3 bg-slate-100 dark:bg-slate-800 p-2 rounded-lg no-print"><div class="text-[9px] font-bold text-slate-500 flex gap-2"><span>⏱️ ${formatTime(timeSpent)}</span> ${timeSpent>120?'<span class="text-rose-500">بطيء</span>':(timeSpent>0&&timeSpent<15)?'<span class="text-brand-500">سريع!</span>':''}</div><button data-action="open-edit-q" data-q-index="${i}" class="text-[9px] font-bold text-rose-500 hover:underline px-2 py-1 rounded bg-rose-50 dark:bg-rose-900/20">تعديل ✏️</button></div>` : ''}
      <div class="text-sm sm:text-base font-black leading-relaxed mb-4 break-words w-full" data-math><span class="text-brand-600 mr-1">${i+1}.</span> ${escapeHtml(q.text)}</div>
      <div class="grid grid-cols-1 ${hasPage ? 'lg:grid-cols-[1fr,200px]' : ''} gap-4 w-full">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 w-full question-options-container">
          ${(q.options||[]).map((opt, oIdx) => {
            const isSel = Number(ans) === oIdx, isCor = Number(q.correctIndex) === oIdx;
            let cls = 'border-slate-200 dark:border-slate-700';
            if (ro) cls = isCor ? 'border-brand-500 bg-brand-50 dark:bg-brand-900/20' : (isSel ? 'border-rose-500 bg-rose-50 dark:bg-rose-900/20' : cls); else if (isSel) cls = 'border-slate-900 bg-slate-900 text-white dark:border-brand-500 dark:bg-brand-900/20 dark:text-brand-300'; else cls += ' hover:border-slate-400';
            const letCls = (isSel && !ro) ? 'bg-white text-slate-900 dark:bg-brand-500 dark:text-white' : 'border-2 border-slate-200 dark:border-slate-600 text-slate-500';
            return `<button ${ro?'disabled':''} data-action="select-answer" data-question-id="${q.id}" data-index="${oIdx}" class="text-right p-2.5 sm:p-3 rounded-xl border-2 transition-all flex items-start gap-2 sm:gap-3 w-full box-border break-words min-w-0 ${cls}"><div class="w-5 h-5 sm:w-6 sm:h-6 rounded-full shrink-0 flex items-center justify-center font-black text-[9px] sm:text-[10px] mt-0.5 ${letCls}">${String.fromCharCode(65+oIdx)}</div><div class="font-bold text-xs sm:text-sm leading-snug flex-1 min-w-0" data-math>${escapeHtml(opt)}</div></button>`;
          }).join('')}
        </div>
        ${hasPage ? renderPdfPreview(q, ex, mode) : ''}
      </div>
      ${ro && q.correctIndex != null ? `<div class="mt-4 p-2 sm:p-3 rounded-lg bg-brand-50 dark:bg-brand-900/20 text-brand-700 dark:text-brand-300 font-bold border border-brand-200 dark:border-brand-800 text-[10px] sm:text-xs w-full break-words box-border print-answer-key">الجواب: ${escapeHtml(q.options[q.correctIndex])}</div>` : ''}
    </div>
  `;
}

      <div class="w-full box-border">
        ${state.subjectTab === 'units' ? `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">${buildSubjectUnits(sc).map((u, i) => { const active = state.unitKey === u.key; const t = getTheme(i); return `<button data-action="select-unit" data-unit-key="${escapeHtml(u.key)}" class="text-right p-4 rounded-3xl border-2 transition-all duration-200 bg-white dark:bg-slate-900 ${active ? `${t.border} shadow-md` : `border-slate-100 dark:border-slate-800 hover:border-slate-200`}"><div class="text-[10px] font-bold ${t.textMain} mb-1">${escapeHtml(u.semesterTitleAr)}</div><h4 class="text-base font-black text-slate-900 dark:text-white leading-snug mb-3">${escapeHtml(u.unitTitleAr)}</h4><div class="flex gap-2 text-[10px] font-semibold"><span class="bg-slate-50 dark:bg-slate-800 px-2 py-1 rounded text-slate-600">${getExamsForUnit(sc, u.key).length} امتحان</span></div></button>`; }).join('')}</div>` + (state.unitKey ? `<div class="mt-6 p-5 bg-brand-50/50 dark:bg-brand-900/10 rounded-[2rem] border border-brand-100 dark:border-brand-900/30 animate-enter"><h3 class="text-xl font-black mb-4">${escapeHtml(parseUnitKey(state.unitKey).unitTitleAr)}</h3><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">${getExamsForUnit(sc, state.unitKey).map((ex, i) => `<div class="bg-white dark:bg-slate-900 p-4 rounded-2xl shadow-sm flex flex-col"><h5 class="font-black text-sm mb-3 line-clamp-2">${escapeHtml(ex.title)}</h5><div class="mt-auto"><button data-action="prepare-exam" data-exam-id="${escapeHtml(ex.id)}" class="w-full py-2.5 bg-slate-900 dark:bg-white text-white dark:text-slate-900 rounded-xl font-bold text-xs">بدء الاختبار</button></div></div>`).join('') || '<div class="col-span-full text-center text-xs text-slate-500 py-4">لا يوجد امتحانات.</div>'}</div></div>` : '') : ''}
        ${state.subjectTab === 'builder' ? `<div class="grid lg:grid-cols-[1fr,250px] gap-5 animate-enter w-full box-border"><div class="bg-white dark:bg-slate-900 p-5 rounded-[2rem] border border-slate-100 shadow-soft"><h3 class="text-lg font-black mb-4">بناء امتحان مخصص</h3><div class="grid grid-cols-2 gap-4 mb-4"><div><label class="text-[10px] font-bold block mb-1">النظام</label><select data-builder-field="mode" class="w-full p-2.5 rounded-xl border text-xs font-bold outline-none dark:bg-slate-950 dark:border-slate-800"><option value="weighted" ${state.builder.mode==='weighted'?'selected':''}>وزن الوزارة</option><option value="manual" ${state.builder.mode==='manual'?'selected':''}>يدوي</option></select></div><div><label class="text-[10px] font-bold block mb-1">الأسئلة</label><input data-builder-field="totalQuestions" type="number" class="w-full p-2.5 rounded-xl border text-xs font-black text-brand-600 outline-none dark:bg-slate-950 dark:border-slate-800" value="${state.builder.totalQuestions}" ${state.builder.mode==='manual'?'disabled opacity-50':''}></div></div><div class="grid grid-cols-1 sm:grid-cols-2 gap-3">${buildSubjectUnits(sc).filter(u=>!u.comprehensive).map(u => { const sel=state.builder.selectedUnitKeys.includes(u.key); return `<div class="p-2.5 rounded-xl border-2 ${sel?'border-brand-500 bg-brand-50 dark:bg-brand-900/20':'border-slate-100 dark:border-slate-800'}"><label class="flex gap-2 cursor-pointer items-start"><input type="checkbox" data-action="toggle-builder-unit" data-unit-key="${escapeHtml(u.key)}" ${sel?'checked':''} class="mt-0.5"><div class="text-xs font-bold leading-snug">${escapeHtml(u.unitTitleAr)}</div></label>${sel&&state.builder.mode==='manual'?`<input type="number" data-action="set-builder-unit-count" data-unit-key="${escapeHtml(u.key)}" class="mt-2 w-full p-1 text-center text-[10px] border rounded dark:bg-slate-950" placeholder="العدد" value="${state.builder.explicitCounts[u.key]||''}">`:''}</div>`}).join('')}</div></div><div class="bg-slate-900 text-white p-5 rounded-[2rem] shadow-soft h-fit sticky top-4"><h4 class="font-black text-sm mb-3">ملخص</h4><div class="space-y-2 mb-5">${computeBuilderPreview(sc).length?computeBuilderPreview(sc).map(p=>`<div class="bg-white/10 p-2 rounded text-[10px] flex justify-between"><span class="truncate pr-2">${escapeHtml(p.unitTitleAr)}</span><span>${p.requested}</span></div>`).join(''):'<div class="text-center text-[10px] opacity-50">اختر وحدات</div>'}</div><button data-action="build-custom-exam" class="w-full py-2.5 bg-brand-500 text-slate-900 rounded-xl font-black text-xs hover:-translate-y-0.5 transition-transform">بناء الامتحان</button></div></div>` : ''}
        ${state.subjectTab === 'overview' ? `<div class="grid grid-cols-1 lg:grid-cols-[1fr,2fr] gap-5 animate-enter w-full box-border"><div class="bg-gradient-to-b from-brand-500 to-brand-700 p-6 rounded-[2rem] text-white flex flex-col items-center justify-center text-center shadow-soft"><div class="text-brand-100 font-bold text-sm mb-1">إتقان المادة العام</div><div class="text-6xl font-black">${(getSubjectAnalytics(sc)||{mastery:0}).mastery}%</div></div><div class="bg-white dark:bg-slate-900 p-5 md:p-6 rounded-[2rem] border border-slate-100 dark:border-slate-800 shadow-soft"><h3 class="text-lg font-black mb-5">تفاصيل الوحدات</h3><div class="space-y-3">${getUnitAnalytics(sc).map(r => `<div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-100 dark:border-slate-800/50 flex flex-col gap-2"><div class="flex justify-between items-center gap-2"><div class="font-bold text-sm truncate">${escapeHtml(r.unitTitleAr)}</div><div class="font-black text-base shrink-0 ${r.mastery>=80?'text-brand-600':r.mastery>=50?'text-amber-500':'text-rose-500'}">${r.mastery}%</div></div><div class="h-1.5 w-full bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden"><div class="h-full rounded-full ${r.mastery>=80?'bg-brand-500':r.mastery>=50?'bg-amber-500':'bg-rose-500'}" style="width:${Math.max(0,Math.min(100,r.mastery))}%"></div></div></div>`).join('')}</div></div></div>` : ''}
        ${state.subjectTab === 'attempts' ? `<div class="bg-white dark:bg-slate-900 p-5 md:p-6 rounded-[2rem] border border-slate-100 dark:border-slate-800 shadow-soft animate-enter w-full box-border"><div class="flex justify-between items-center mb-6"><h3 class="text-lg font-black">أرشيف المحاولات</h3><button data-action="redo-by-subject" data-subject-code="${escapeHtml(sc)}" class="px-4 py-2 bg-rose-50 text-rose-600 rounded-lg text-[10px] font-bold">امتحان أخطاء المادة</button></div><div class="space-y-3">${(state.data.results||[]).filter(r=>r.subjectCode===sc).map(r => `<div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 p-3 bg-slate-50 dark:bg-slate-950 rounded-xl border border-slate-100 dark:border-slate-800/60 w-full box-border"><div class="min-w-0 w-full"><div class="font-black text-sm truncate">${escapeHtml(r.examTitle)}</div><div class="text-[9px] text-slate-500 truncate">${escapeHtml(r.unitTitleAr)} • ${escapeHtml(formatDate(r.createdAt))}</div></div><div class="flex items-center gap-2 shrink-0"><div class="text-lg font-black w-10 text-center">${r.score}%</div><button data-action="review-attempt" data-attempt-id="${r.id||r.resultId}" class="px-3 py-1.5 bg-white border border-slate-200 dark:border-slate-700 dark:bg-slate-800 rounded-md text-[10px] font-bold">مراجعة</button></div></div>`).join('')||'<div class="py-4 text-center text-xs text-slate-400">سجلك فارغ.</div>'}</div></div>` : ''}
      </div>
    </div>
  `;
}

function renderApp() {
  if (!state.user) return renderLogin();
  let main = '';
  if (state.examSession) main = renderExamScreen();
  else if (state.reviewAttempt) main = renderReviewScreen();
  else if (state.subjectCode) main = renderSubjectScreen(state.subjectCode);
  else main = renderHome();

  return `
    <main class="w-full max-w-[100vw] sm:max-w-6xl mx-auto p-3 sm:p-5 min-h-screen pb-20 box-border overflow-x-hidden">${main}</main>
    ${renderPrestartModal()}
    ${renderAdminModal()}
    ${state.admin.open ? '' : renderLeaderboardModal()} 
    ${state.toast ? `<div class="fixed bottom-4 left-1/2 transform -translate-x-1/2 w-[90%] max-w-sm z-[110] animate-enter no-print"><div class="px-4 py-3 rounded-2xl font-bold text-xs shadow-float flex items-center justify-between gap-3 ${state.toast.type==='error'?'bg-rose-600 text-white':'bg-slate-900 text-white dark:bg-white dark:text-slate-900'}"><span class="truncate">${escapeHtml(state.toast.msg)}</span><button data-action="close-toast" class="opacity-70 hover:opacity-100 shrink-0">✕</button></div></div>` : ''}
    ${state.loading ? `<div class="fixed inset-0 z-[120] bg-slate-900/40 backdrop-blur-sm flex items-center justify-center animate-enter no-print"><div class="bg-white dark:bg-slate-900 px-5 py-3 rounded-2xl shadow-float flex items-center gap-3 font-black text-brand-600 text-xs"><svg class="animate-spin w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>الرجاء الانتظار</div></div>` : ''}
  `;
}

function render() {
  document.getElementById('root').innerHTML = renderApp();
  setTimeout(() => {
    setDarkMode(state.darkMode);
    if (window.renderMathInElement) document.querySelectorAll('[data-math]').forEach(n => { try { window.renderMathInElement(n, {delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false}); }catch(e){} });
    renderPdfCanvases();
  }, 0);
}

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-action]'); if(!t) return;
  const a = t.getAttribute('data-action');
  try {
    if(a==='login'){ const v=String(document.getElementById('login-name')?.value||'').trim(); if(!v)return showToast('أدخل اسمك','error'); state.user={id:v.replace(/\s+/g,'_'),name:v}; saveLocal(CONFIG.STORAGE_KEYS.user,state.user); await refreshData(); return; }
    if(a==='logout'){ localStorage.removeItem(CONFIG.STORAGE_KEYS.user); state.user=null; state.examSession=null; state.reviewAttempt=null; state.subjectCode=null; clearExamTimer(); render(); return; }
    if(a==='toggle-dark') return setDarkMode(!state.darkMode);
    if(a==='go-home') { state.subjectCode=null; state.reviewAttempt=null; state.examSession=null; render(); return; }
    if(a==='open-subject'){ openSubject(t.getAttribute('data-subject-code')); return; }
    if(a==='subject-tab'){ state.subjectTab=t.getAttribute('data-tab'); render(); return; }
    if(a==='select-unit'){ state.unitKey=t.getAttribute('data-unit-key'); render(); return; }
    if(a==='prepare-exam'){ setLoading(true); const ex=await api('getExamBundle',{examId:t.getAttribute('data-exam-id')}).then(x=>x.exam); state.prestartExam={exam:ex}; state.loading=false; render(); return; }
    if(a==='close-prestart'){ state.prestartExam=null; render(); return; }
    if(a==='start-prepared-exam'){ beginExam(state.prestartExam.exam); return; }
    if(a==='pause-exam') { saveLocal(CONFIG.STORAGE_KEYS.savedExam, { userId: state.user.id, session: state.examSession }); state.examSession = null; clearExamTimer(); showToast('تم الحفظ! يمكنك الخروج والعودة لاحقاً.'); render(); return; }
    if(a==='select-answer'){
      if(!state.examSession)return; const qid=t.getAttribute('data-question-id'), idx=Number(t.getAttribute('data-index')); state.examSession.answers[qid]=idx;
      state.examSession.timePerQuestion[qid] = (state.examSession.timePerQuestion[qid] || 0) + (state.examSession._secSinceLastClick || 0); state.examSession._secSinceLastClick = 0;
      const c=t.closest('.question-options-container'); if(c){ c.querySelectorAll('button[data-action="select-answer"]').forEach((b,bi)=>{ const s=bi===idx; b.className=`text-right p-2.5 sm:p-3 rounded-xl border-2 transition-all flex items-start gap-2 sm:gap-3 w-full box-border break-words min-w-0 ${s?'border-slate-900 bg-slate-900 text-white dark:border-brand-500 dark:bg-brand-900/20 dark:text-brand-300':'border-slate-200 dark:border-slate-700 hover:border-slate-400'}`; const l=b.querySelector('.w-5'); if(l) l.className=`w-5 h-5 sm:w-6 sm:h-6 rounded-full shrink-0 flex items-center justify-center font-black text-[9px] sm:text-[10px] mt-0.5 transition-colors ${s?'bg-white text-slate-900 dark:bg-brand-500 dark:text-white':'border-2 border-slate-200 dark:border-slate-600 text-slate-500'}`; }); } updateProgressUI(); return;
    }
    if(a==='submit-exam') return submitExam();
    if(a==='review-attempt'){ setLoading(true); const r=await api('getAttemptReview',{attemptId:t.getAttribute('data-attempt-id')}); state.reviewAttempt=r.attempt; state.loading=false; render(); return; }
    if(a==='redo-attempt' || a==='redo-by-subject' || a==='daily-review') {
       setLoading(true); let p = { userId: state.user.id, limit: 30 };
       if(a==='redo-attempt') p.resultId = t.getAttribute('data-attempt-id'); if(a==='redo-by-subject') p.subjectCode = t.getAttribute('data-subject-code');
       try { const r=await api(a==='redo-attempt' ? 'buildWrongRedo' : 'generateRedoExam', p); state.prestartExam={exam:r.exam}; } catch(e){ showToast(e.message,'error'); } finally{ setLoading(false); render(); } return;
    }
    if(a==='open-leaderboard') { document.body.insertAdjacentHTML('beforeend', renderLeaderboardModal()); return; }
    if(a==='close-leaderboard') { const m = document.querySelector('.fixed.z-50'); if(m) m.remove(); return; }
    if(a==='open-edit-q') { state.editQuestionData = JSON.parse(JSON.stringify(state.reviewAttempt.examSnapshot.questions[Number(t.getAttribute('data-q-index'))])); render(); return; }
    if(a==='close-edit-q') { state.editQuestionData = null; render(); return; }
    if(a==='submit-edit-q') {
       const pw = document.getElementById('edit-q-password').value, txt = document.getElementById('edit-q-text').value, opts = document.getElementById('edit-q-options').value.split('\n').map(s=>s.trim()).filter(Boolean), cor = document.getElementById('edit-q-correct').value;
       if(pw !== '1234') return showToast('كلمة المرور غير صحيحة', 'error'); if(!txt || opts.length < 2 || !cor || Number(cor)<1 || Number(cor)>opts.length) return showToast('بيانات السؤال غير مكتملة', 'error');
       try { setLoading(true); await api('fixQuestion', { password: pw, questionId: state.editQuestionData.id, sourceExamId: state.editQuestionData.sourceExamId || state.reviewAttempt.examId, text: txt, options: opts, correctIndex: Number(cor)-1 }); state.editQuestionData = null; await refreshData(); state.reviewAttempt = (await api('getAttemptReview', { attemptId: state.reviewAttempt.id })).attempt; showToast('تم التصحيح وتعديل درجات الطلاب بنجاح!'); } catch(e) { showToast(e.message, 'error'); } finally { setLoading(false); render(); } return;
    }
    if(a==='open-admin'){ state.admin.open=true; render(); return; }
    if(a==='close-admin'){ state.admin.open=false; render(); return; }
    if(a==='admin-login-submit'){ await adminLogin(document.getElementById('admin-password-input').value); return; }
    if(a==='admin-tab'){ state.admin.tab=t.getAttribute('data-tab'); render(); return; }
    if(a==='admin-upload-submit'){
      const sc=document.getElementById('admin-subject-select').value, uk=document.getElementById('admin-unit-select').value, jt=document.getElementById('admin-json-input').value;
      if(!sc||!uk||!jt) return showToast('بيانات ناقصة','error'); let pj; try{ pj=JSON.parse(jt); }catch(e){ return showToast('JSON غير صالح','error'); }
      const sInf=CURRICULUM.subjects.find(s=>s.code===sc), uInf=parseUnitKey(uk); pj.subjectCode=sInf.code; pj.subjectAr=sInf.nameAr; pj.semester=uInf.semester; pj.unitTitleAr=uInf.unitTitleAr;
      (pj.questions||[]).forEach(q=>{ q.subjectCode=sInf.code; q.subjectAr=sInf.nameAr; q.semester=uInf.semester; q.unitTitleAr=uInf.unitTitleAr; });
      try{ setLoading(true); await api('uploadExam',{adminPassword:CONFIG.ADMIN_PASSWORD,examJson:JSON.stringify(pj),pdfDataUrl:state.admin.form.pdfDataUrl,pdfFileName:state.admin.form.pdfFileName,examId:state.admin.form.editingExamId}); showToast('تم الحفظ'); state.admin.form.editingExamId=null; await refreshData(); }catch(e){ showToast(e.message,'error'); }finally{ setLoading(false); render(); } return;
    }
    if(a==='close-toast'){ state.toast=null; render(); return; }
  } catch(e) { showToast(e.message, 'error'); }
});

document.addEventListener('change', e => {
  if(e.target.id === 'admin-csv-file') {
    const file = e.target.files[0];
    if(file) {
      const reader = new FileReader();
      reader.onload = ev => {
         const lines = ev.target.result.split('\n'); let questions = [];
         for(let i=1; i<lines.length; i++) {
            if(!lines[i].trim()) continue; let parts = lines[i].split(','); 
            if(parts.length >= 6) {
               let qObj = { text: parts[0].trim(), options: [parts[1].trim(), parts[2].trim(), parts[3].trim(), parts[4].trim()].filter(Boolean), correctIndex: Number(parts[5].trim()) - 1 };
               if(parts[6] && parts[6].trim()) qObj.pageId = parts[6].trim();
               questions.push(qObj);
            }
         }
         if(questions.length) { document.getElementById('admin-json-input').value = JSON.stringify({ title: "امتحان من CSV", questions: questions }, null, 2); showToast('تم تحويل الـ CSV بنجاح!'); } else showToast('ملف غير صالح', 'error');
      }; reader.readAsText(file);
    }
  }
  const bf = e.target.getAttribute('data-builder-field');
  if(bf){ if(bf==='mode') state.builder.mode=e.target.value; if(bf==='totalQuestions') state.builder.totalQuestions=Number(e.target.value||0); render(); return; }
  if(e.target.getAttribute('data-action')==='set-builder-unit-count'){ state.builder.explicitCounts[e.target.getAttribute('data-unit-key')]=Number(e.target.value||0); render(); return; }
  if(e.target.id==='admin-subject-select'){ state.admin.form.subjectCode=e.target.value; state.admin.form.unitKey=''; render(); return; }
  if(e.target.id==='admin-unit-select'){ state.admin.form.unitKey=e.target.value; render(); return; }
  if(e.target.id==='admin-json-file'){ const f=e.target.files[0]; if(f){ const r=new FileReader(); r.onload=ev=>{ document.getElementById('admin-json-input').value=ev.target.result; }; r.readAsText(f); } }
  if(e.target.id==='admin-pdf-file'){ const f=e.target.files[0]; if(f){ const r=new FileReader(); r.onload=ev=>{ state.admin.form.pdfDataUrl=ev.target.result; state.admin.form.pdfFileName=f.name; render(); }; r.readAsDataURL(f); } }
});

render(); if(state.user) refreshData();
</script>
</body>
</html>
