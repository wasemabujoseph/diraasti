<script>
const CONFIG = {

    { code:'islamic_education', nameAr:'التربية الإسلامية', examMode:'OMR_MCQ', weights:{ '1|علاقه الانسان بربه':16.66,'1|علاقه الانسان بنفسه':16.66,'1|علاقه الانسان بمن حوله':16.66,'2|علاقه الانسان بربه':16.66,'2|علاقه الانسان بنفسه':16.66,'2|علاقه الانسان بمن حوله':16.66 }, semesters:[ { semester:1,titleAr:'الفصل الأول',units:['علاقه الانسان بربه','علاقه الانسان بنفسه','علاقه الانسان بمن حوله'] }, { semester:2,titleAr:'الفصل الثاني',units:['علاقه الانسان بربه','علاقه الانسان بنفسه','علاقه الانسان بمن حوله'] } ] },

const THEMES = [
  { border:'border-brand-500', bgOuter:'bg-brand-50 dark:bg-brand-900/10', textMain:'text-brand-700 dark:text-brand-400', badge:'bg-brand-100 text-brand-800 dark:bg-brand-900/40 dark:text-brand-300' },
  { border:'border-blue-500', bgOuter:'bg-blue-50 dark:bg-blue-900/10', textMain:'text-blue-700 dark:text-blue-400', badge:'bg-blue-100 text-blue-800 dark:bg-blue-900/40 dark:text-blue-300' },
  { border:'border-purple-500', bgOuter:'bg-purple-50 dark:bg-purple-900/10', textMain:'text-purple-700 dark:text-purple-400', badge:'bg-purple-100 text-purple-800 dark:bg-purple-900/40 dark:text-purple-300' },
  { border:'border-amber-500', bgOuter:'bg-amber-50 dark:bg-amber-900/10', textMain:'text-amber-700 dark:text-amber-400', badge:'bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-300' },

];
function getTheme(index) { return THEMES[index % THEMES.length]; }

const state = {
  user: loadLocal(CONFIG.STORAGE_KEYS.user, null),
  darkMode: loadLocal(CONFIG.STORAGE_KEYS.darkMode, false),
  loading: false, toast: null,
  data: {
    exams: [],
    results: [],
    analytics: { profile: { badges: [] }, subjectMastery: [], unitMastery: [], weaknessRows: [], timeStats: { byUnit: [] }, dueReviewCount: 0, overallMastery: 0 },
    questionBankSummary: { totalQuestions: 0, bySubject: {}, byUnitKey: {}, byLessonKey: {}, subjects: [] },
    leaderboard: [],
    syllabus: buildDefaultSyllabus()
  },
  subjectCode: null, subjectTab: 'units', unitKey: null, lessonKey: null,
  prestartExam: null, examSession: null, reviewAttempt: null, timerId: null,
  builder: { totalQuestions: 100, mode: 'unit', selectedUnitKeys: [], selectedLessonKeys: [], explicitCounts: {}, selectedExamIds: [] },
  admin: { open: false, authenticated: false, tab: 'upload', allResults: [], insights: { difficulty: [], leaderboard: [], edits: [] }, selectedUserId: null, selectedSubjectCode: null, form: { subjectCode: '', unitKey: '', lessonKey: '', editingExamId: null, pdfDataUrl: null, pdfFileName: '', jsonText: '' } },
  editor: { open: false, questions: [], drafts: [], index: 0, draft: null, password: '', attemptId: '', editorRole: 'student', viewMode: 'single' },
  resumeDraft: loadLocal(CONFIG.STORAGE_KEYS.activeSession, null)
};

window.__PDF_SOURCES = {};
window.__PDF_DOCS = {};

function loadLocal(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } }
function saveLocal(key, value) { localStorage.setItem(key, JSON.stringify(value)); }
function removeLocal(key) { localStorage.removeItem(key); }
function setDarkMode(value) { state.darkMode = !!value; document.documentElement.classList.toggle('dark', state.darkMode); saveLocal(CONFIG.STORAGE_KEYS.darkMode, state.darkMode); }
setDarkMode(state.darkMode);

function escapeHtml(v) { return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function initials(n) { return String(n || '').split(/\s+/).filter(Boolean).slice(0,2).map(p => p[0]).join('').toUpperCase() || 'ط'; }
function formatDate(v) { if (!v) return '-'; try { return new Date(v).toLocaleString('ar-JO', { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }); } catch (e) { return String(v); } }
function percent(c, t) { if (!t) return 0; return Math.round((Number(c || 0) / Number(t || 1)) * 100); }
function formatDuration(sec) { sec = Number(sec || 0); const h = Math.floor(sec / 3600); const m = Math.floor((sec % 3600) / 60); const s = sec % 60; return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }
function alpha(i) { return String.fromCharCode(65 + Number(i || 0)); }
function avg(arr) { if (!arr.length) return 0; return Math.round(arr.reduce((a,b)=>a+Number(b||0),0) / arr.length); }
function clone(v) { return JSON.parse(JSON.stringify(v)); }

function getSubject(code) { return CURRICULUM.subjects.find(s => s.code === code) || null; }
function getSubjectSummary(code) { return (state.data.questionBankSummary.subjects || []).find(s => s.subjectCode === code) || { subjectCode: code, units: [] }; }
function makeUnitKey(sc, sem, ut) { return [sc, Number(sem || 0), ut || ''].join('||'); }
function parseUnitKey(uk) { const p = String(uk || '').split('||'); return { subjectCode: p[0] || '', semester: Number(p[1] || 0), unitTitleAr: p.slice(2).join('||') || '' }; }
function hasApiBase() { return String(CONFIG.API_BASE || '').startsWith('https://script.google.com/'); }
function stripBase64Exam(ex) { const c = clone(ex); if (c.sourcePdf && c.sourcePdf.base64) delete c.sourcePdf.base64; if (c.sourcePdfsMap) delete c.sourcePdfsMap; ['questions','openQuestions'].forEach(k => (c[k] || []).forEach(q => { if (q && q.sourcePdfBase64) delete q.sourcePdfBase64; })); return c; }
function getQuestionPdfSource(q, exam) { return q.sourcePdfBase64 || (exam && exam.sourcePdfsMap && q.sourceExamId && exam.sourcePdfsMap[q.sourceExamId]) || (exam && exam.sourcePdf && exam.sourcePdf.base64) || ''; }
function getCurrentExamQuestion() { if (!state.examSession) return null; return (state.examSession.exam.questions || [])[state.examSession.currentIndex || 0] || null; }
function getCurrentReviewQuestion() { if (!state.reviewAttempt) return null; return (state.reviewAttempt.examSnapshot.questions || [])[state.reviewAttempt.currentIndex || 0] || null; }


function buildDefaultSyllabus() {
  const subjects = {};
  (CURRICULUM.subjects || []).forEach(s => { subjects[s.code] = { nameAr: s.nameAr, weights: s.weights || {} }; });
  return { subjects, lessonBlueprints: {} };
}
function makeLessonKey(subjectCode, semester, unitTitleAr, lessonTitleAr) { return [subjectCode || '', Number(semester || 0), unitTitleAr || '', lessonTitleAr || ''].join('||'); }
function parseLessonKey(key) { const p = String(key || '').split('||'); return { subjectCode: p[0] || '', semester: Number(p[1] || 0), unitTitleAr: p[2] || '', lessonTitleAr: p.slice(3).join('||') || '' }; }
function getLessonBlueprintsForUnit(sc, semester, unitTitleAr) {
  const bp = state.data && state.data.syllabus && state.data.syllabus.lessonBlueprints ? state.data.syllabus.lessonBlueprints : {};
  return (bp[sc] && bp[sc][`${Number(semester || 0)}|${unitTitleAr || ''}`]) ? bp[sc][`${Number(semester || 0)}|${unitTitleAr || ''}`] : [];
}
function getLessonsForUnit(sc, unitKey) {
  const info = parseUnitKey(unitKey);
  const exams = getExamsForUnit(sc, unitKey);
  const map = {};
  exams.forEach(ex => {
    const title = String(ex.lessonTitleAr || ex.subunitTitleAr || 'غير مصنف');
    const key = makeLessonKey(sc, info.semester, info.unitTitleAr, title);
    if (!map[key]) map[key] = { key, subjectCode: sc, semester: info.semester, unitTitleAr: info.unitTitleAr, lessonTitleAr: title, examCount: 0, questionCount: 0 };
    map[key].examCount += 1;
    map[key].questionCount += Number(ex.questionCount || 0);
  });
  getLessonBlueprintsForUnit(sc, info.semester, info.unitTitleAr).forEach(lesson => {
    const title = String(lesson.titleAr || lesson.lessonTitleAr || 'غير مصنف');
    const key = makeLessonKey(sc, info.semester, info.unitTitleAr, title);
    if (!map[key]) map[key] = { key, subjectCode: sc, semester: info.semester, unitTitleAr: info.unitTitleAr, lessonTitleAr: title, examCount: 0, questionCount: 0, weight: lesson.weight || 0 };
  });
  return Object.values(map).sort((a, b) => String(a.lessonTitleAr).localeCompare(String(b.lessonTitleAr), 'ar'));
}
function getExamsForLesson(sc, unitKey, lessonKey) {
  const lesson = parseLessonKey(lessonKey);
  return getExamsForUnit(sc, unitKey).filter(ex => String(ex.lessonTitleAr || ex.subunitTitleAr || 'غير مصنف') === String(lesson.lessonTitleAr || ''));
}
function buildSubjectUnits(sc) {
  const sub = getSubject(sc); if (!sub) return [];
  const units = [];
  sub.semesters.forEach(sem => sem.units.forEach(ut => units.push({ key: makeUnitKey(sc, sem.semester, ut), subjectCode: sc, semester: sem.semester, semesterTitleAr: sem.titleAr, unitTitleAr: ut, weight: Number(sub.weights[`${sem.semester}|${ut}`] || 0) })));
  units.push({ key: makeUnitKey(sc, 0, CURRICULUM.comprehensiveLabel), subjectCode: sc, semester: 0, semesterTitleAr: 'الفصلان معاً', unitTitleAr: CURRICULUM.comprehensiveLabel, weight: 0, comprehensive: true });
  return units;
}
function getExamsForSubject(sc) { return (state.data.exams || []).filter(e => e.subjectCode === sc); }
function getExamsForUnit(sc, uk) { const info = parseUnitKey(uk); return getExamsForSubject(sc).filter(e => Number(e.semester || 0) === Number(info.semester || 0) && String(e.unitTitleAr || '').trim() === String(info.unitTitleAr || '').trim()); }
function getQuestionCountForUnit(uk) { return Number((state.data.questionBankSummary.byUnitKey || {})[uk] || 0); }
function getAttemptsForSubject(sc) { return (state.data.results || []).filter(r => r.subjectCode === sc); }
function getSubjectAnalytics(sc) { return (state.data.analytics.subjectMastery || []).find(i => i.subjectCode === sc) || null; }
function getUnitAnalytics(sc) { return (state.data.analytics.unitMastery || []).filter(i => i.subjectCode === sc); }
function getSlowUnitsForSubject(sc) { return (state.data.analytics.timeStats.byUnit || []).filter(i => i.subjectCode === sc).sort((a,b)=>b.avgSec-a.avgSec); }

async function api(action, payload) {
  if (!hasApiBase()) throw new Error('رابط API غير صالح');
  const res = await fetch(CONFIG.API_BASE, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action }, payload || {})) });
  if (!res.ok) throw new Error('فشل الاتصال بالخادم');
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'خطأ غير معروف');
  return data;
}
function showToast(msg, type = 'success') { state.toast = { msg, type }; render(); clearTimeout(showToast._timer); showToast._timer = setTimeout(() => { state.toast = null; render(); }, 3200); }
function setLoading(v) { state.loading = !!v; render(); }

function syncResumeDraftState() {
  const draft = loadLocal(CONFIG.STORAGE_KEYS.activeSession, null);
  if (!draft || !state.user || draft.userId !== state.user.id) {
    if (draft && state.user && draft.userId !== state.user.id) removeLocal(CONFIG.STORAGE_KEYS.activeSession);
    state.resumeDraft = null;
  } else state.resumeDraft = draft;
}


async function refreshData() {
  if (!state.user) return;
  syncResumeDraftState();
  try {
    setLoading(true);
    const boot = await api('getUserBootstrap', { userId: state.user.id });
    state.data.exams = boot.catalog && boot.catalog.exams ? boot.catalog.exams : [];
    state.data.questionBankSummary = boot.catalog && boot.catalog.questionBank ? boot.catalog.questionBank : { totalQuestions: 0, bySubject: {}, byUnitKey: {}, byLessonKey: {}, subjects: [] };
    state.data.syllabus = boot.catalog && boot.catalog.syllabus ? boot.catalog.syllabus : buildDefaultSyllabus();
    state.data.results = boot.results || [];
    state.data.analytics = boot.analytics || { profile: { badges: [] }, timeStats: { byUnit: [] }, subjectMastery: [], unitMastery: [], weaknessRows: [], dueReviewCount: 0 };
    state.data.leaderboard = boot.leaderboard || [];
    render();
  } catch (err) { showToast('خطأ المزامنة: ' + err.message, 'error'); }
  finally { state.loading = false; render(); }
}



async function refreshAdminData() {
  if (!state.admin.authenticated) return;
  const boot = await api('getAdminBootstrap', { adminPassword: CONFIG.ADMIN_PASSWORD, subjectCode: state.admin.selectedSubjectCode || '' });
  state.admin.allResults = boot.results || [];
  state.admin.insights = { difficulty: boot.difficulty || [], leaderboard: boot.leaderboard || [], edits: boot.edits || [] };
}



function resetBuilderForSubject(sc) {
  const units = buildSubjectUnits(sc).filter(u => !u.comprehensive);
  state.builder.selectedUnitKeys = units.slice(0, Math.min(3, units.length)).map(u => u.key);
  state.builder.selectedLessonKeys = [];
  state.builder.selectedExamIds = [];
  state.builder.selectedUnitKeys.forEach(unitKey => {
    getLessonsForUnit(sc, unitKey).forEach(lesson => {
      state.builder.selectedLessonKeys.push(lesson.key);
      getExamsForLesson(sc, unitKey, lesson.key).forEach(ex => { if (!state.builder.selectedExamIds.includes(ex.id)) state.builder.selectedExamIds.push(ex.id); });
    });
  });
  state.builder.explicitCounts = {};
  state.builder.mode = 'unit';
  state.builder.totalQuestions = 100;
}


function openSubject(sc) { state.subjectCode = sc; state.subjectTab = 'units'; state.unitKey = null; state.lessonKey = null; resetBuilderForSubject(sc); render(); }
function backToHome() { state.subjectCode = null; state.subjectTab = 'units'; state.unitKey = null; state.lessonKey = null; state.reviewAttempt = null; state.prestartExam = null; render(); }
function persistActiveSession() { if (state.examSession) { state.examSession.userId = state.user ? state.user.id : ''; saveLocal(CONFIG.STORAGE_KEYS.activeSession, state.examSession); state.resumeDraft = clone(state.examSession); } else { removeLocal(CONFIG.STORAGE_KEYS.activeSession); state.resumeDraft = null; } }
function clearExamTimer() { if (state.timerId) { clearInterval(state.timerId); state.timerId = null; } }

function startExamTimer() {
  clearExamTimer();
  if (!state.examSession) return;
  state.timerId = setInterval(() => {
    if (!state.examSession) { clearExamTimer(); return; }
    state.examSession.timeSpent = Number(state.examSession.timeSpent || 0) + 1;
    const q = getCurrentExamQuestion();
    if (q) state.examSession.questionTimes[q.id] = Number(state.examSession.questionTimes[q.id] || 0) + 1;
    const timerEl = document.getElementById('exam-timer-display'); if (timerEl) timerEl.textContent = formatDuration(state.examSession.timeSpent || 0);
    const qTimerEl = document.getElementById('question-timer-display'); if (qTimerEl && q) qTimerEl.textContent = formatDuration(state.examSession.questionTimes[q.id] || 0);
    if ((state.examSession.timeSpent || 0) % 5 === 0) persistActiveSession();
  }, 1000);
}

function prepareExamForStart(exam) { state.prestartExam = { exam }; render(); }
function beginExam(exam) {
  state.prestartExam = null;
  state.reviewAttempt = null;
  state.examSession = { userId: state.user.id, exam: exam, answers: {}, questionTimes: {}, timeSpent: 0, currentIndex: 0, startedAt: new Date().toISOString(), viewMode: (exam.settings && exam.settings.defaultQuestionView) || 'single' };
  persistActiveSession();
  render();
  startExamTimer();
}
function resumeSavedSession() { syncResumeDraftState(); if (!state.resumeDraft || !state.user || state.resumeDraft.userId !== state.user.id) return; state.examSession = clone(state.resumeDraft); if (!state.examSession.viewMode) state.examSession.viewMode = ((state.examSession.exam && state.examSession.exam.settings && state.examSession.exam.settings.defaultQuestionView) || 'single'); state.prestartExam = null; state.reviewAttempt = null; render(); startExamTimer(); }
function pauseExamAndExit() { if (!state.examSession) return; persistActiveSession(); clearExamTimer(); state.examSession = null; state.prestartExam = null; state.reviewAttempt = null; showToast('تم حفظ التقدم ويمكنك الإكمال لاحقاً'); render(); }

function validateEditorDrafts_(drafts) {
  const cleaned = drafts.map(d => {
    const draft = clone(d);
    draft.options = (draft.options || []).map(v => String(v || '').trim());
    while (draft.options.length && !draft.options[draft.options.length - 1]) draft.options.pop();
    return draft;
  });
  for (const draft of cleaned) {
    if (!draft.text.trim()) throw new Error('اكتب نص كل سؤال قبل الحفظ');
    if (draft.options.filter(Boolean).length < 2) throw new Error('كل سؤال يجب أن يحتوي خيارين على الأقل');
    if (draft.correctIndex === '' || draft.correctIndex === null || draft.correctIndex === undefined) throw new Error('اختر الإجابة الصحيحة لكل سؤال');
  }
  return cleaned;
}

function parseCorrectCell(v) {
  const raw = String(v == null ? '' : v).trim();
  if (!raw) return null;
  if (/^[A-Fa-f]$/.test(raw)) return raw.toUpperCase().charCodeAt(0) - 65;
  if (/^\d+$/.test(raw)) { const n = Number(raw); if (n >= 1 && n <= 6) return n - 1; return n; }
  return null;
}
function excelRowsToExam(rows, fileName) {
  if (!rows.length) throw new Error('الملف فارغ');
  const first = rows[0];
  const keys = Object.keys(first).reduce((acc, key) => { acc[key.trim().toLowerCase()] = key; return acc; }, {});
  function pick(row, aliases) { for (const alias of aliases) { const k = keys[alias.toLowerCase()]; if (k != null && row[k] !== undefined && row[k] !== null && String(row[k]).trim() !== '') return row[k]; } return ''; }
  const questions = rows.map((row, idx) => {
    const text = pick(row, ['text','question','questiontext','السؤال','نص السؤال']);
    const options = [ pick(row, ['option1','a','choice1','الخيار1','الخيار 1','أ']), pick(row, ['option2','b','choice2','الخيار2','الخيار 2','ب']), pick(row, ['option3','c','choice3','الخيار3','الخيار 3','ج']), pick(row, ['option4','d','choice4','الخيار4','الخيار 4','د']), pick(row, ['option5','e','choice5','الخيار5','الخيار 5']), pick(row, ['option6','f','choice6','الخيار6','الخيار 6']) ].map(v => String(v || '').trim()).filter(Boolean);
    if (!String(text || '').trim() || options.length < 2) return null;
    const correctIndex = parseCorrectCell(pick(row, ['correctindex','correct','answer','الإجابة الصحيحة','correct answer']));
    return { id: 'q' + (idx + 1), text: String(text).trim(), options, correctIndex, explanation: String(pick(row, ['explanation','شرح','ملاحظات','note'])).trim(), pdfPageRef: pick(row, ['pdfpage','page','pageid','page number']) ? { page: Number(pick(row, ['pdfpage','page','pageid','page number'])) } : undefined };
  }).filter(Boolean);
  return { title: (fileName || 'Exam').replace(/\.[^.]+$/, ''), examMode: 'OMR_MCQ', duration: 0, allowStudentTimeOverride: false, questions, openQuestions: [] };
}
function loadExcelOrCsv(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => { try { const wb = XLSX.read(e.target.result, { type: 'array' }); const ws = wb.Sheets[wb.SheetNames[0]]; const rows = XLSX.utils.sheet_to_json(ws, { defval: '' }); const exam = excelRowsToExam(rows, file.name); state.admin.form.jsonText = JSON.stringify(exam, null, 2); render(); showToast('تم تحويل الملف إلى JSON بنجاح'); } catch (err) { showToast('تعذر قراءة ملف Excel/CSV', 'error'); } };
  reader.readAsArrayBuffer(file);
}

async function renderPdfCanvases() {

  for (const canvas of canvases) {
    canvas.setAttribute('data-rendered', 'true');
    const key = canvas.getAttribute('data-pdf-key'), pageNum = Number(canvas.getAttribute('data-page') || 1), b64 = window.__PDF_SOURCES[key];
    if (!b64) continue;
    try {
      if (!window.__PDF_DOCS[key]) { const bin = atob(b64); const bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i); window.__PDF_DOCS[key] = await window.pdfjsLib.getDocument({ data: bytes }).promise; }

}

    if (action === 'close-admin') { closeAdmin(); return; }
    if (action === 'admin-login-submit') { await adminLogin(document.getElementById('admin-password-input')?.value || ''); return; }
    if (action === 'open-subject') { openSubject(target.getAttribute('data-subject-code')); return; }
    if (action === 'subject-tab') { state.subjectTab = target.getAttribute('data-tab'); render(); return; }
    if (action === 'select-unit') { state.unitKey = target.getAttribute('data-unit-key'); state.lessonKey = null; render(); return; }
    if (action === 'select-lesson') { state.lessonKey = target.getAttribute('data-lesson-key'); render(); return; }
    if (action === 'go-home') { backToHome(); return; }
    if (action === 'prepare-exam') { setLoading(true); const ex = await loadExam(target.getAttribute('data-exam-id')); prepareExamForStart(ex); state.loading = false; render(); return; }
    if (action === 'close-prestart') { state.prestartExam = null; render(); return; }
    if (action === 'start-prepared-exam') { beginExam(state.prestartExam.exam); return; }
    if (action === 'pause-exam') { pauseExamAndExit(); return; }
    if (action === 'resume-exam') { resumeSavedSession(); return; }
    if (action === 'discard-resume') { removeLocal(CONFIG.STORAGE_KEYS.activeSession); state.resumeDraft = null; render(); return; }
    if (action === 'select-answer') { selectExamAnswer(target.getAttribute('data-question-id'), Number(target.getAttribute('data-index'))); return; }
    if (action === 'goto-exam-question') { goToExamQuestion(Number(target.getAttribute('data-index'))); return; }
    if (action === 'prev-exam-question') { goToExamQuestion((state.examSession.currentIndex || 0) - 1); return; }
    if (action === 'next-exam-question') { goToExamQuestion((state.examSession.currentIndex || 0) + 1); return; }
    if (action === 'goto-review-question') { goToReviewQuestion(Number(target.getAttribute('data-index'))); return; }
    if (action === 'prev-review-question') { goToReviewQuestion((state.reviewAttempt.currentIndex || 0) - 1); return; }
    if (action === 'next-review-question') { goToReviewQuestion((state.reviewAttempt.currentIndex || 0) + 1); return; }
    if (action === 'submit-exam') { if (confirm('هل أنت متأكد من تسليم الامتحان؟')) await submitExam(); return; }
    if (action === 'review-attempt') { await openAttemptReview(target.getAttribute('data-attempt-id')); return; }
    if (action === 'redo-attempt') { await generateRedo({ attemptId: target.getAttribute('data-attempt-id') }); return; }
    if (action === 'redo-by-subject') { await generateRedo({ subjectCode: target.getAttribute('data-subject-code') }); return; }
    if (action === 'review-today') { await reviewToday(target.getAttribute('data-subject-code') || ''); return; }
    if (action === 'build-custom-exam') { await generateCustomExam(); return; }
    if (action === 'toggle-builder-unit') {
      const unitKey = target.getAttribute('data-unit-key');
      if (target.checked) {
        if (!state.builder.selectedUnitKeys.includes(unitKey)) state.builder.selectedUnitKeys.push(unitKey);
        getLessonsForUnit(state.subjectCode, unitKey).forEach(lesson => {
          if (!state.builder.selectedLessonKeys.includes(lesson.key)) state.builder.selectedLessonKeys.push(lesson.key);
          getExamsForLesson(state.subjectCode, unitKey, lesson.key).forEach(ex => { if (!state.builder.selectedExamIds.includes(ex.id)) state.builder.selectedExamIds.push(ex.id); });
        });
      } else {
        state.builder.selectedUnitKeys = state.builder.selectedUnitKeys.filter(k => k !== unitKey);
        delete state.builder.explicitCounts[unitKey];
        const lessonKeys = getLessonsForUnit(state.subjectCode, unitKey).map(x => x.key);
        state.builder.selectedLessonKeys = state.builder.selectedLessonKeys.filter(k => !lessonKeys.includes(k));
        const examIds = lessonKeys.flatMap(lk => getExamsForLesson(state.subjectCode, unitKey, lk).map(x => x.id));
        state.builder.selectedExamIds = state.builder.selectedExamIds.filter(id => !examIds.includes(id));
      }
      render(); return;
    }
    if (action === 'toggle-builder-lesson') {
      const lessonKey = target.getAttribute('data-lesson-key');
      const lesson = parseLessonKey(lessonKey);
      if (target.checked) {
        if (!state.builder.selectedLessonKeys.includes(lessonKey)) state.builder.selectedLessonKeys.push(lessonKey);
        getExamsForLesson(state.subjectCode, makeUnitKey(state.subjectCode, lesson.semester, lesson.unitTitleAr), lessonKey).forEach(ex => { if (!state.builder.selectedExamIds.includes(ex.id)) state.builder.selectedExamIds.push(ex.id); });
      } else {
        state.builder.selectedLessonKeys = state.builder.selectedLessonKeys.filter(k => k !== lessonKey);
        const examIds = getExamsForLesson(state.subjectCode, makeUnitKey(state.subjectCode, lesson.semester, lesson.unitTitleAr), lessonKey).map(x => x.id);
        state.builder.selectedExamIds = state.builder.selectedExamIds.filter(id => !examIds.includes(id));
      }
      render(); return;
    }
    if (action === 'toggle-builder-exam') {
      const examId = target.getAttribute('data-exam-id');
      if (target.checked) { if (!state.builder.selectedExamIds.includes(examId)) state.builder.selectedExamIds.push(examId); }
      else state.builder.selectedExamIds = state.builder.selectedExamIds.filter(id => id !== examId);
      render(); return;
    }
    if (action === 'export-exam-pdf') { await downloadExamPdf({ examId: target.getAttribute('data-exam-id'), includeAnswerKey: true }, 'exam.pdf'); return; }
    if (action === 'export-current-exam-pdf') { if (state.examSession) await downloadExamPdf({ examJson: stripBase64Exam(state.examSession.exam), includeAnswerKey: true }, 'exam.pdf'); return; }
    if (action === 'export-attempt-pdf') { await downloadExamPdf({ attemptId: target.getAttribute('data-attempt-id'), includeAnswerKey: true }, 'attempt.pdf'); return; }
    if (action === 'review-edit-question') { openEditorFromReview(state.admin.authenticated ? 'admin' : 'student'); return; }
    if (action === 'set-exam-view') { setExamViewMode(target.getAttribute('data-view')); return; }
    if (action === 'set-review-view') { setReviewViewMode(target.getAttribute('data-view')); return; }
    if (action === 'set-editor-view') { setEditorViewMode(target.getAttribute('data-view')); return; }
    if (action === 'close-editor') { closeEditor(); return; }
    if (action === 'editor-prev') { nextEditorQuestion(-1); return; }
    if (action === 'editor-next') { nextEditorQuestion(1); return; }
    if (action === 'editor-set-correct') { const draftIndex = Number(target.getAttribute('data-editor-draft-index') || state.editor.index || 0); if (state.editor.drafts[draftIndex]) state.editor.drafts[draftIndex].correctIndex = Number(target.getAttribute('data-index')); hydrateEditorDraft(); render(); return; }
    if (action === 'save-editor-question') { await saveEditorQuestion(); return; }
    if (action === 'save-editor-all') { await saveAllEditorQuestions(); return; }
    if (action === 'admin-tab') { state.admin.tab = target.getAttribute('data-tab'); if (state.admin.tab !== 'results') { state.admin.selectedUserId = null; state.admin.selectedSubjectCode = null; } render(); return; }
    if (action === 'admin-select-user') { state.admin.selectedUserId = target.getAttribute('data-uid') || null; state.admin.selectedSubjectCode = null; render(); return; }
    if (action === 'admin-select-subject') { state.admin.selectedSubjectCode = target.getAttribute('data-sc') || null; render(); return; }
    if (action === 'admin-view-attempt') { state.admin.open = false; await openAttemptReview(target.getAttribute('data-attempt-id')); return; }
    if (action === 'admin-edit-exam') { await adminEditExam(target.getAttribute('data-exam-id')); return; }
    if (action === 'admin-delete-exam') { await adminDeleteExam(target.getAttribute('data-exam-id')); return; }
    if (action === 'admin-upload-submit') { await adminUploadExam(); return; }
    if (action === 'close-toast') { state.toast = null; render(); return; }
  } catch (err) { state.loading = false; render(); showToast(err.message, 'error'); }
});
document.addEventListener('input', e => {
  const builderField = e.target.getAttribute('data-builder-field');
  if (builderField) { if (builderField === 'mode') state.builder.mode = e.target.value; if (builderField === 'totalQuestions') state.builder.totalQuestions = Number(e.target.value || 0); render(); return; }
  if (e.target.getAttribute('data-action') === 'set-builder-unit-count') { state.builder.explicitCounts[e.target.getAttribute('data-unit-key')] = Number(e.target.value || 0); render(); return; }
  if (e.target.id === 'admin-json-input') { state.admin.form.jsonText = e.target.value; return; }
  const editorField = e.target.getAttribute('data-editor-field');
  if (editorField && state.editor.open) {
    const draftIndex = Number(e.target.getAttribute('data-editor-draft-index') || state.editor.index || 0);
    if (editorField === 'password') state.editor.password = e.target.value;
    else if (state.editor.drafts[draftIndex]) state.editor.drafts[draftIndex][editorField] = e.target.value;
    hydrateEditorDraft();
    return;
  }
  const optionIndex = e.target.getAttribute('data-editor-option-index');
  if (optionIndex != null && state.editor.open) {
    const draftIndex = Number(e.target.getAttribute('data-editor-draft-index') || state.editor.index || 0);
    if (state.editor.drafts[draftIndex]) state.editor.drafts[draftIndex].options[Number(optionIndex)] = e.target.value;
    hydrateEditorDraft();
    return;
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'admin-subject-select') { state.admin.form.subjectCode = e.target.value; state.admin.form.unitKey = ''; state.admin.form.lessonKey = ''; render(); return; }
  if (e.target.id === 'admin-unit-select') { state.admin.form.unitKey = e.target.value; state.admin.form.lessonKey = ''; render(); return; }
  if (e.target.id === 'admin-lesson-select') { state.admin.form.lessonKey = e.target.value; render(); return; }
  if (e.target.id === 'admin-json-file') { const file = e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = ev => { state.admin.form.jsonText = String(ev.target.result || ''); render(); }; reader.readAsText(file, 'utf-8'); return; }
  if (e.target.id === 'admin-excel-file') { const file = e.target.files[0]; if (file) loadExcelOrCsv(file); return; }
  if (e.target.id === 'admin-pdf-file') { const file = e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = ev => { state.admin.form.pdfDataUrl = ev.target.result; state.admin.form.pdfFileName = file.name; render(); }; reader.readAsDataURL(file); return; }
  if (e.target.id === 'admin-json-input') { state.admin.form.jsonText = e.target.value; return; }
});
window.addEventListener('beforeunload', () => { if (state.examSession) persistActiveSession(); });

render();
if (state.user) refreshData();
</script>
</body>
</html>
